# Runs on every push: lint and test the back end and the front end.
# The deploy jobs (ECR, EC2, S3, CloudFront) are added in phase 11.
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Back end (Ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # A throwaway PostgreSQL that lives only for this job.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: clinisar
          POSTGRES_USER: clinisar
          POSTGRES_PASSWORD: clinisar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinisar"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      POSTGRES_DB: clinisar
      POSTGRES_USER: clinisar
      POSTGRES_PASSWORD: clinisar
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (Ruff)
        run: ruff check .
      - name: Check formatting (Ruff)
        run: ruff format --check .
      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Tests (pytest)
        run: pytest

  frontend:
    name: Front end (ESLint + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint (ESLint)
        run: npm run lint
      - name: Check formatting (Prettier)
        run: npm run format:check
      - name: Unit tests (Vitest)
        run: npm test
      - name: Build
        run: npm run build
